[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
authors = ["moonlight contributors"]
edition = "2021"
homepage = "https://moonlight-mod.github.io/"
repository = "https://github.com/moonlight-mod/moonlight-installer"
license = "MIT"
version = "0.2.6"

[workspace.dependencies]
libmoonlight = { path = "./crates/libmoonlight" }
reqwest = { version = "0.12.28", features = ["blocking", "json", "rustls-tls"], default-features = false }
eframe = { version = "0.36.1", features = ["accesskit", "default_fonts", "persistence"] }
eyre = "0.6.14"
flate2 = "1.1.9"
egui = "0.36.1"
flume = "0.12.0"
tar = "0.4.46"
serde_json = "1.0.151"
thiserror = "2.0.20"
color-eyre = { version = "0.6.5", default-features = false }
clap = { version = "4.6.6", features = ["derive", "cargo"] }
clap_complete = "4.6.9"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
nix = { version = "0.31.3", features = ["user"] }
serde_ini = "0.2.0"
serde-value = "0.7.0"
pathdiff = "0.2.3"
